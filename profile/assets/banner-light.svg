<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient (Crisp, modern, airy) -->
    <linearGradient id="lightBg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Ambient Radiant Glows for Light Mode -->
    <radialGradient id="lightMeshGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 200) rotate(90) scale(260 380)">
      <stop offset="0%" stop-color="#00C875" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#0077FF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="lightLeftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 80) rotate(90) scale(200 300)">
      <stop offset="0%" stop-color="#0077FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- Text Highlight Gradient (High contrast for light theme) -->
    <linearGradient id="lightTextGrad" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>

    <!-- Delicate Facet Glass Fills for Light Mode -->
    <linearGradient id="lightFacetGrad1" x1="850" y1="90" x2="980" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A86B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="lightFacetGrad2" x1="740" y1="170" x2="880" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#009BFF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#1B54F4" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="lightFacetGrad3" x1="910" y1="150" x2="1080" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0077FF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#00C875" stop-opacity="0.02" />
    </linearGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      fill: #0F172A;
    }
    .brand-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      fill: #0066FF;
    }
    .brand-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.5;
      fill: #475569;
    }
  </style>

  <!-- Card Canvas & Lighting (Pure, light, airy) -->
  <rect width="1200" height="400" rx="16" fill="url(#lightBg)" />
  <rect width="1200" height="400" rx="16" fill="url(#lightMeshGlow)" />
  <rect width="1200" height="400" rx="16" fill="url(#lightLeftGlow)" />
  <rect width="1200" height="400" rx="16" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Left: Content Typography -->
  <g transform="translate(80, 75)">
    <!-- Small Tag Badge -->
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
    <text x="84" y="18" text-anchor="middle" class="brand-tag">NEXTMATRIX LLC</text>

    <!-- Main Slogan -->
    <text x="0" y="78" class="brand-title">Crafting the</text>
    <text x="0" y="132" class="brand-title">Next Generation</text>
    <text x="0" y="186" class="brand-title" fill="url(#lightTextGrad)">of Digital Tools.</text>

    <!-- Subtitle -->
    <text x="0" y="235" class="brand-desc">Dependable, privacy-first software engineered for native speed,</text>
    <text x="0" y="260" class="brand-desc">physical data custody, and user sovereignty.</text>
  </g>

  <!-- Right: Delicate Topographic Network Matrix (Vibrant jewel tones on crisp light canvas) -->
  <g id="matrix-mesh">
    <!-- Subtle Translucent Facets -->
    <polygon points="850,80 970,120 910,190" fill="url(#lightFacetGrad1)" />
    <polygon points="730,180 850,80 830,220" fill="url(#lightFacetGrad2)" />
    <polygon points="830,220 910,190 870,300" fill="url(#lightFacetGrad1)" />
    <polygon points="910,190 1020,170 990,270" fill="url(#lightFacetGrad3)" />
    <polygon points="970,120 1090,110 1020,170" fill="url(#lightFacetGrad3)" />
    <polygon points="870,300 990,270 970,350" fill="url(#lightFacetGrad2)" />
    <polygon points="990,270 1100,240 1060,330" fill="url(#lightFacetGrad1)" />

    <!-- Network Interconnect Edges -->
    <line x1="760" y1="60" x2="850" y2="80" stroke="#009BFF" stroke-width="1.1" stroke-opacity="0.35" />
    <line x1="850" y1="80" x2="970" y2="120" stroke="#00A86B" stroke-width="1.3" stroke-opacity="0.55" />
    <line x1="970" y1="120" x2="1090" y2="110" stroke="#0077FF" stroke-width="1.1" stroke-opacity="0.4" />
    <line x1="1090" y1="110" x2="1140" y2="180" stroke="#1B54F4" stroke-width="0.9" stroke-opacity="0.25" />

    <!-- Cross Triangulation Ribs -->
    <line x1="680" y1="170" x2="730" y2="180" stroke="#0077FF" stroke-width="0.9" stroke-opacity="0.25" />
    <line x1="730" y1="180" x2="850" y2="80" stroke="#009BFF" stroke-width="1.2" stroke-opacity="0.45" />
    <line x1="730" y1="180" x2="830" y2="220" stroke="#00A86B" stroke-width="1.5" stroke-opacity="0.6" />
    <line x1="730" y1="180" x2="760" y2="290" stroke="#0066FF" stroke-width="1" stroke-opacity="0.35" />

    <line x1="850" y1="80" x2="830" y2="220" stroke="#0077FF" stroke-width="1.1" stroke-opacity="0.4" />
    <line x1="850" y1="80" x2="910" y2="190" stroke="#00A86B" stroke-width="1.3" stroke-opacity="0.6" />
    <line x1="970" y1="120" x2="910" y2="190" stroke="#009BFF" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="970" y1="120" x2="1020" y2="170" stroke="#0066FF" stroke-width="1.1" stroke-opacity="0.4" />
    <line x1="1090" y1="110" x2="1020" y2="170" stroke="#00A86B" stroke-width="1.3" stroke-opacity="0.5" />

    <line x1="830" y1="220" x2="910" y2="190" stroke="#00A86B" stroke-width="1.6" stroke-opacity="0.75" />
    <line x1="910" y1="190" x2="1020" y2="170" stroke="#0066FF" stroke-width="1.4" stroke-opacity="0.6" />
    <line x1="1020" y1="170" x2="1100" y2="240" stroke="#0077FF" stroke-width="1.1" stroke-opacity="0.4" />
    <line x1="1020" y1="170" x2="1140" y2="180" stroke="#1B54F4" stroke-width="0.9" stroke-opacity="0.25" />

    <!-- Center to Lower Network -->
    <line x1="760" y1="290" x2="830" y2="220" stroke="#009BFF" stroke-width="1.1" stroke-opacity="0.4" />
    <line x1="760" y1="290" x2="870" y2="300" stroke="#0077FF" stroke-width="1" stroke-opacity="0.35" />
    <line x1="830" y1="220" x2="870" y2="300" stroke="#00A86B" stroke-width="1.4" stroke-opacity="0.6" />
    <line x1="910" y1="190" x2="870" y2="300" stroke="#0066FF" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="910" y1="190" x2="990" y2="270" stroke="#00A86B" stroke-width="1.5" stroke-opacity="0.65" />
    <line x1="1020" y1="170" x2="990" y2="270" stroke="#009BFF" stroke-width="1.2" stroke-opacity="0.45" />

    <line x1="870" y1="300" x2="990" y2="270" stroke="#0066FF" stroke-width="1.3" stroke-opacity="0.5" />
    <line x1="870" y1="300" x2="910" y2="360" stroke="#1B54F4" stroke-width="0.9" stroke-opacity="0.3" />
    <line x1="870" y1="300" x2="970" y2="350" stroke="#00A86B" stroke-width="1.2" stroke-opacity="0.5" />

    <line x1="990" y1="270" x2="970" y2="350" stroke="#00A86B" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="990" y1="270" x2="1100" y2="240" stroke="#0077FF" stroke-width="1.3" stroke-opacity="0.5" />
    <line x1="990" y1="270" x2="1060" y2="330" stroke="#009BFF" stroke-width="1" stroke-opacity="0.4" />
    <line x1="1100" y1="240" x2="1060" y2="330" stroke="#0066FF" stroke-width="1" stroke-opacity="0.35" />
    <line x1="970" y1="350" x2="1060" y2="330" stroke="#00A86B" stroke-width="1" stroke-opacity="0.35" />
    <line x1="1100" y1="240" x2="1150" y2="270" stroke="#0077FF" stroke-width="0.8" stroke-opacity="0.2" />

    <!-- Depth Grid Dashes -->
    <line x1="760" y1="60" x2="730" y2="180" stroke="#0066FF" stroke-width="0.7" stroke-opacity="0.2" stroke-dasharray="3 3" />
    <line x1="850" y1="80" x2="1090" y2="110" stroke="#00A86B" stroke-width="0.7" stroke-opacity="0.18" stroke-dasharray="4 4" />
    <line x1="760" y1="290" x2="910" y2="360" stroke="#0077FF" stroke-width="0.7" stroke-opacity="0.2" stroke-dasharray="3 3" />

    <!-- Luminous Micro Nodes for Light Mode -->
    <!-- Peripheral Micro Nodes -->
    <circle cx="760" cy="60" r="2" fill="#009BFF" fill-opacity="0.7" />
    <circle cx="680" cy="170" r="1.8" fill="#0066FF" fill-opacity="0.6" />
    <circle cx="1140" cy="180" r="2.2" fill="#0077FF" fill-opacity="0.6" />
    <circle cx="1150" cy="270" r="1.8" fill="#009BFF" fill-opacity="0.6" />
    <circle cx="910" cy="360" r="2" fill="#0066FF" fill-opacity="0.6" />

    <!-- Secondary Nodes -->
    <circle cx="760" cy="290" r="2.8" fill="#0066FF" />
    <circle cx="1090" cy="110" r="2.8" fill="#0077FF" />
    <circle cx="970" cy="120" r="3" fill="#009BFF" />
    <circle cx="1060" cy="330" r="2.6" fill="#00A86B" />
    <circle cx="970" cy="350" r="2.8" fill="#00A86B" />
    <circle cx="1100" cy="240" r="3" fill="#0077FF" />

    <!-- Primary Vertices (Emerald & Sapphire Jewels on light canvas) -->
    <!-- Node A: (850, 80) -->
    <circle cx="850" cy="80" r="7" fill="#00A86B" fill-opacity="0.16" />
    <circle cx="850" cy="80" r="3.4" fill="#00A86B" />

    <!-- Node B: (730, 180) -->
    <circle cx="730" cy="180" r="7" fill="#009BFF" fill-opacity="0.16" />
    <circle cx="730" cy="180" r="3.4" fill="#009BFF" />

    <!-- Central Anchor: (830, 220) -->
    <circle cx="830" cy="220" r="9" fill="#00A86B" fill-opacity="0.2" />
    <circle cx="830" cy="220" r="4" fill="#00A86B" />

    <!-- Central Anchor: (910, 190) -->
    <circle cx="910" cy="190" r="9.5" fill="#00A86B" fill-opacity="0.22" />
    <circle cx="910" cy="190" r="4.2" fill="#00A86B" />

    <!-- Node C: (1020, 170) -->
    <circle cx="1020" cy="170" r="8" fill="#0066FF" fill-opacity="0.18" />
    <circle cx="1020" cy="170" r="3.6" fill="#0066FF" />

    <!-- Node D: (870, 300) -->
    <circle cx="870" cy="300" r="8" fill="#0077FF" fill-opacity="0.18" />
    <circle cx="870" cy="300" r="3.6" fill="#0077FF" />

    <!-- Node E: (990, 270) -->
    <circle cx="990" cy="270" r="8.5" fill="#009BFF" fill-opacity="0.18" />
    <circle cx="990" cy="270" r="3.8" fill="#009BFF" />
  </g>
</svg>
