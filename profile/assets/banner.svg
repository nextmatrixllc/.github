<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="55%" stop-color="#0D1320" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>

    <!-- Mesh Ambient Radiant Glow -->
    <radialGradient id="meshGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 200) rotate(90) scale(260 380)">
      <stop offset="0%" stop-color="#00C875" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#0077FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="leftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 80) rotate(90) scale(180 280)">
      <stop offset="0%" stop-color="#1B54F4" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
    </radialGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C3F3" />
      <stop offset="100%" stop-color="#00C875" />
    </linearGradient>

    <!-- Delicate Facet Glass Fills -->
    <linearGradient id="facetGrad1" x1="850" y1="90" x2="980" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C875" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0077FF" stop-opacity="0.015" />
    </linearGradient>
    <linearGradient id="facetGrad2" x1="740" y1="170" x2="880" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C3F3" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#1B54F4" stop-opacity="0.015" />
    </linearGradient>
    <linearGradient id="facetGrad3" x1="910" y1="150" x2="1080" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#009BFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00C875" stop-opacity="0.015" />
    </linearGradient>
  </defs>

  <style>
    .brand-title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
      fill: #FFFFFF;
    }
    .brand-tag {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      fill: #00C3F3;
    }
    .brand-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.5;
      fill: #94A3B8;
    }
  </style>

  <!-- Card Canvas & Ambient Glows -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="url(#meshGlow)" />
  <rect width="1200" height="400" rx="16" fill="url(#leftGlow)" />
  <rect width="1200" height="400" rx="16" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />

  <!-- Left: Content Typography -->
  <g transform="translate(80, 75)">
    <!-- Small Tag Badge with NEXTMATRIX LLC -->
    <rect x="0" y="0" width="168" height="28" rx="14" fill="#1B54F4" fill-opacity="0.18" stroke="#009BFF" stroke-opacity="0.35" />
    <text x="84" y="18" text-anchor="middle" class="brand-tag">NEXTMATRIX LLC</text>

    <!-- Main Slogan -->
    <text x="0" y="78" class="brand-title">Crafting the</text>
    <text x="0" y="132" class="brand-title">Next Generation</text>
    <text x="0" y="186" class="brand-title" fill="url(#textGrad)">of Digital Tools.</text>

    <!-- Subtitle -->
    <text x="0" y="235" class="brand-desc">Dependable, privacy-first software engineered for native speed,</text>
    <text x="0" y="260" class="brand-desc">physical data custody, and user sovereignty.</text>
  </g>

  <!-- Right: Delicate Fine-Line Topographic Network Matrix -->
  <g id="matrix-mesh">
    <!-- Extremely Subtle Facets for Depth -->
    <polygon points="850,80 970,120 910,190" fill="url(#facetGrad1)" />
    <polygon points="730,180 850,80 830,220" fill="url(#facetGrad2)" />
    <polygon points="830,220 910,190 870,300" fill="url(#facetGrad1)" />
    <polygon points="910,190 1020,170 990,270" fill="url(#facetGrad3)" />
    <polygon points="970,120 1090,110 1020,170" fill="url(#facetGrad3)" />
    <polygon points="870,300 990,270 970,350" fill="url(#facetGrad2)" />
    <polygon points="990,270 1100,240 1060,330" fill="url(#facetGrad1)" />

    <!-- Network Interconnect Edges (Fine, crisp lines) -->
    <!-- Top & Perimeter -->
    <line x1="760" y1="60" x2="850" y2="80" stroke="#00C3F3" stroke-width="0.9" stroke-opacity="0.3" />
    <line x1="850" y1="80" x2="970" y2="120" stroke="#00C875" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="970" y1="120" x2="1090" y2="110" stroke="#009BFF" stroke-width="0.9" stroke-opacity="0.35" />
    <line x1="1090" y1="110" x2="1140" y2="180" stroke="#0077FF" stroke-width="0.8" stroke-opacity="0.2" />

    <!-- Cross Triangulation Ribs -->
    <line x1="680" y1="170" x2="730" y2="180" stroke="#1B54F4" stroke-width="0.8" stroke-opacity="0.2" />
    <line x1="730" y1="180" x2="850" y2="80" stroke="#00C3F3" stroke-width="1" stroke-opacity="0.4" />
    <line x1="730" y1="180" x2="830" y2="220" stroke="#00C875" stroke-width="1.3" stroke-opacity="0.5" />
    <line x1="730" y1="180" x2="760" y2="290" stroke="#0077FF" stroke-width="0.9" stroke-opacity="0.25" />

    <line x1="850" y1="80" x2="830" y2="220" stroke="#009BFF" stroke-width="0.9" stroke-opacity="0.3" />
    <line x1="850" y1="80" x2="910" y2="190" stroke="#00C875" stroke-width="1.1" stroke-opacity="0.5" />
    <line x1="970" y1="120" x2="910" y2="190" stroke="#00C3F3" stroke-width="1" stroke-opacity="0.4" />
    <line x1="970" y1="120" x2="1020" y2="170" stroke="#0077FF" stroke-width="0.9" stroke-opacity="0.3" />
    <line x1="1090" y1="110" x2="1020" y2="170" stroke="#00C875" stroke-width="1.1" stroke-opacity="0.4" />

    <line x1="830" y1="220" x2="910" y2="190" stroke="#00C875" stroke-width="1.4" stroke-opacity="0.6" />
    <line x1="910" y1="190" x2="1020" y2="170" stroke="#00C3F3" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="1020" y1="170" x2="1100" y2="240" stroke="#009BFF" stroke-width="0.9" stroke-opacity="0.35" />
    <line x1="1020" y1="170" x2="1140" y2="180" stroke="#0077FF" stroke-width="0.8" stroke-opacity="0.2" />

    <!-- Center to Lower Network -->
    <line x1="760" y1="290" x2="830" y2="220" stroke="#00C3F3" stroke-width="0.9" stroke-opacity="0.3" />
    <line x1="760" y1="290" x2="870" y2="300" stroke="#0077FF" stroke-width="0.9" stroke-opacity="0.3" />
    <line x1="830" y1="220" x2="870" y2="300" stroke="#00C875" stroke-width="1.2" stroke-opacity="0.5" />
    <line x1="910" y1="190" x2="870" y2="300" stroke="#009BFF" stroke-width="1" stroke-opacity="0.4" />
    <line x1="910" y1="190" x2="990" y2="270" stroke="#00C875" stroke-width="1.3" stroke-opacity="0.55" />
    <line x1="1020" y1="170" x2="990" y2="270" stroke="#00C3F3" stroke-width="1" stroke-opacity="0.4" />

    <line x1="870" y1="300" x2="990" y2="270" stroke="#00C3F3" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="870" y1="300" x2="910" y2="360" stroke="#0077FF" stroke-width="0.8" stroke-opacity="0.25" />
    <line x1="870" y1="300" x2="970" y2="350" stroke="#00C875" stroke-width="1" stroke-opacity="0.4" />

    <line x1="990" y1="270" x2="970" y2="350" stroke="#00C875" stroke-width="1" stroke-opacity="0.4" />
    <line x1="990" y1="270" x2="1100" y2="240" stroke="#009BFF" stroke-width="1.1" stroke-opacity="0.4" />
    <line x1="990" y1="270" x2="1060" y2="330" stroke="#00C3F3" stroke-width="0.9" stroke-opacity="0.35" />
    <line x1="1100" y1="240" x2="1060" y2="330" stroke="#0077FF" stroke-width="0.9" stroke-opacity="0.3" />
    <line x1="970" y1="350" x2="1060" y2="330" stroke="#00C875" stroke-width="0.8" stroke-opacity="0.25" />
    <line x1="1100" y1="240" x2="1150" y2="270" stroke="#009BFF" stroke-width="0.7" stroke-opacity="0.15" />

    <!-- Tertiary Faint Depth Lines -->
    <line x1="760" y1="60" x2="730" y2="180" stroke="#0077FF" stroke-width="0.6" stroke-opacity="0.15" stroke-dasharray="3 3" />
    <line x1="850" y1="80" x2="1090" y2="110" stroke="#00C875" stroke-width="0.6" stroke-opacity="0.12" stroke-dasharray="4 4" />
    <line x1="760" y1="290" x2="910" y2="360" stroke="#0077FF" stroke-width="0.6" stroke-opacity="0.15" stroke-dasharray="3 3" />
    <line x1="1140" y1="180" x2="1100" y2="240" stroke="#00C3F3" stroke-width="0.6" stroke-opacity="0.15" />

    <!-- Delicate Micro Nodes (Refined, Constellation-scale) -->
    <!-- Distant Micro Dots (r=1.5 ~ 2) -->
    <circle cx="760" cy="60" r="1.8" fill="#00C3F3" fill-opacity="0.6" />
    <circle cx="680" cy="170" r="1.6" fill="#1B54F4" fill-opacity="0.5" />
    <circle cx="1140" cy="180" r="2" fill="#0077FF" fill-opacity="0.6" />
    <circle cx="1150" cy="270" r="1.5" fill="#009BFF" fill-opacity="0.5" />
    <circle cx="910" cy="360" r="1.8" fill="#0077FF" fill-opacity="0.5" />

    <!-- Secondary Nodes (r=2.2 ~ 2.8) -->
    <circle cx="760" cy="290" r="2.4" fill="#0077FF" />
    <circle cx="1090" cy="110" r="2.5" fill="#009BFF" />
    <circle cx="970" cy="120" r="2.8" fill="#00C3F3" />
    <circle cx="1060" cy="330" r="2.2" fill="#00C875" fill-opacity="0.8" />
    <circle cx="970" cy="350" r="2.5" fill="#00C875" />
    <circle cx="1100" cy="240" r="2.8" fill="#009BFF" />

    <!-- Major Vertices with Subtle, Refined Glow (r=3 ~ 3.5, Glow r=6 ~ 8) -->
    <!-- Node A: (850, 80) -->
    <circle cx="850" cy="80" r="6" fill="#00C875" fill-opacity="0.15" />
    <circle cx="850" cy="80" r="3" fill="#00C875" />
    <circle cx="850" cy="80" r="1.2" fill="#FFFFFF" />

    <!-- Node B: (730, 180) -->
    <circle cx="730" cy="180" r="6" fill="#00C3F3" fill-opacity="0.15" />
    <circle cx="730" cy="180" r="3" fill="#00C3F3" />
    <circle cx="730" cy="180" r="1.2" fill="#FFFFFF" />

    <!-- Central Anchor: (830, 220) -->
    <circle cx="830" cy="220" r="8" fill="#00C875" fill-opacity="0.18" />
    <circle cx="830" cy="220" r="3.6" fill="#00C875" />
    <circle cx="830" cy="220" r="1.5" fill="#FFFFFF" />

    <!-- Central Anchor: (910, 190) -->
    <circle cx="910" cy="190" r="8.5" fill="#00C875" fill-opacity="0.2" />
    <circle cx="910" cy="190" r="3.8" fill="#00C875" />
    <circle cx="910" cy="190" r="1.6" fill="#FFFFFF" />

    <!-- Node C: (1020, 170) -->
    <circle cx="1020" cy="170" r="7" fill="#009BFF" fill-opacity="0.15" />
    <circle cx="1020" cy="170" r="3.2" fill="#009BFF" />
    <circle cx="1020" cy="170" r="1.3" fill="#FFFFFF" />

    <!-- Node D: (870, 300) -->
    <circle cx="870" cy="300" r="7" fill="#0077FF" fill-opacity="0.15" />
    <circle cx="870" cy="300" r="3.2" fill="#0077FF" />
    <circle cx="870" cy="300" r="1.3" fill="#FFFFFF" />

    <!-- Node E: (990, 270) -->
    <circle cx="990" cy="270" r="7.5" fill="#00C3F3" fill-opacity="0.16" />
    <circle cx="990" cy="270" r="3.5" fill="#00C3F3" />
    <circle cx="990" cy="270" r="1.4" fill="#FFFFFF" />
  </g>
</svg>
